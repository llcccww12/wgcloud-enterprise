<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>


</head>
<body th:class="${session.sidebarCollapse}">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>

  <!-- Content Wrapper. Contains page content -->
  <div th:class="'content-wrapper '+${session.themeNameSign}"  style="font-size:0.90rem">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1></h1>
          </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item active"></li>
                </ol>
            </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

  <div class="col-md-11">
    <div th:class="'card card-primary '+${session.themeNameSign}">
      <div class="card-header">
        <h3 class="card-title">添加SNMP设备监测（比如交换机、防火墙）</h3>
          <div class=" float-sm-right">
              <a href="javascript:history.back()">返回上级</a>
          </div>
      </div>
      <!-- /.card-header -->
      <!-- form start -->
        <form role="form" id="form1" method="post" th:action="@{'/snmpInfo/save'}">
            <input type="hidden" name="id" th:value="${snmpInfo.id}"/>
            <div class="card-body">
                <div class="form-group">
                    <label><font color="red">*</font>设备IP</label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.hostname}" class="validate[required,maxSize[50]] form-control" name="hostname" id="hostname" placeholder="输入IP">
                </div>
                <div class="form-group">
                    <label><font color="red">*</font>SNMP端口</label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.snmpPort}" class="validate[custom[number],required,maxSize[50]] form-control" name="snmpPort" id="snmpPort" placeholder="如161">
                </div>
                <div class="form-group">
                    <label><font color="red">*</font>SNMP版本</label>
                    <div class="input-group">
                        <div class="icheck-primary d-inline">
                            <input type="radio" id="snmpVer1" name="snmpVersion" value="0">
                            <label for="snmpVer1"><span style="opacity:.70">version1</span></label>
                        </div>
                        <div class="icheck-success d-inline" style="margin-left:30px;">
                            <input type="radio" id="snmpVer2" name="snmpVersion" value="1" checked>
                            <label for="snmpVer2"><span style="opacity:.70">version2c</span></label>
                        </div>
                        <div class="icheck-teal d-inline" style="margin-left:30px;">
                            <input type="radio" id="snmpVer3" name="snmpVersion" value="3">
                            <label for="snmpVer3"><span style="opacity:.70">version3</span></label>
                        </div>
                    </div>
                </div>
                <div style="display:none" id="snmpV3InfoDev">
                    <div class="form-group">
                        <label>SNMP v3用户名</label>
                        <input type="text" autocomplete="off"  th:value="${snmpInfo.securityName}" class="validate[maxSize[50]] form-control" name="securityName" id="securityName" placeholder="">
                    </div>
                    <div class="form-group">
                        <label>SNMP v3认证密码<span class="text-muted">（认证协议为DES）</span></label>
                        <input type="text" autocomplete="off"  th:value="${snmpInfo.authPass}" class="validate[maxSize[50]] form-control" name="authPass" id="authPass" placeholder="">
                    </div>
                    <div class="form-group">
                        <label>SNMP v3加密密码<span class="text-muted">（加密协议为MD5）</span></label>
                        <input type="text" autocomplete="off"  th:value="${snmpInfo.privPass}" class="validate[maxSize[50]] form-control" name="privPass" id="privPass" placeholder="">
                    </div>
                </div>
                <div class="form-group">
                    <label><font color="red">*</font>SNMP团体名称（community）</label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.snmpCommunity}" class="validate[maxSize[50]] form-control" name="snmpCommunity" id="snmpCommunity" placeholder="如public">
                </div>
                <div class="form-group">
                    <label>上行流量的OID<span class="text-muted">（OID一般为1.3.6.1.2.1.2.2.1.16.X，其中X一般为接口序号，多个请换行填写。如果填写1.3.6.1.2.1.2.2.1.16，系统默认会自动获取所有接口流量）</span></label>
                    <textarea class="validate[maxSize[2000]] form-control"   name="sentOID" id="sentOID"
                              th:text="${snmpInfo.sentOID}"  rows="12" placeholder='1.3.6.1.2.1.2.2.1.16.1
1.3.6.1.2.1.2.2.1.16.2
1.3.6.1.2.1.2.2.1.16.3'></textarea>
                </div>
                <div class="form-group">
                    <label>下行流量的OID<span class="text-muted">（OID一般为1.3.6.1.2.1.2.2.1.10.X，其中X一般为接口序号，多个请换行填写。如果填写1.3.6.1.2.1.2.2.1.10，系统默认会自动获取所有接口流量）</span></label>
                    <textarea class="validate[maxSize[2000]] form-control"   name="recvOID" id="recvOID"
                              th:text="${snmpInfo.recvOID}"  rows="12" placeholder='1.3.6.1.2.1.2.2.1.10.1
1.3.6.1.2.1.2.2.1.10.2
1.3.6.1.2.1.2.2.1.10.3'></textarea>
                </div>
                <div class="form-group">
                    <label>系统基本信息OID<span class="text-muted">（一般为1.3.6.1.2.1.1.1.0，也可以填写设备名称的OID等）</span></label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.sysDescOid}" class="validate[maxSize[100]] form-control" name="sysDescOid" id="sysDescOid" placeholder="">
                </div>
                <div class="form-group"><span class="text-muted">提示：磁盘占用率，CPU使用率，内存使用率，运行温度，设备运行时间这些OID，默认是使用snmpget方式获取数据。如果想用snmpwalk方式获取oid的对应数据，可以写聚合函数，比如avg[oid]表示系统会自动计算平均值，max[oid]表示自动计算最大值，min[oid]表示自动计算最小值，sum[oid]表示自动求和，count[oid]表示自动计算数量</span></div>
                <div class="form-group">
                    <label>磁盘占用率OID<span class="text-muted">（可以只填写磁盘使用率OID。也支持填写表达式计算磁盘使用率，如：100 - [1.3.6.1.4.1.2011.5.25.31.1.1.13.1.3]，表达式中OID要用方括号括起来）</span></label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.diskPerOid}" class="validate[maxSize[300]] form-control" name="diskPerOid" id="diskPerOid" placeholder="1.3.6.1.4.1.2011.5.25.31.1.1.13.1.3">
                </div>
                <div class="form-group">
                    <label id="cpuLabel">CPU使用率OID<span class="text-muted">（可以只填写CPU使用率OID。也支持填写表达式计算CPU使用率，如：100 - [1.3.6.1.4.1.9.2.1.56.0]，表达式中OID要用方括号括起来）</span></label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.cpuPerOID}" class="validate[maxSize[300]] form-control" name="cpuPerOID" id="cpuPerOID" placeholder="1.3.6.1.4.1.9.2.1.56.0">
                </div>
                <div class="form-group">
                    <label id="memLabel">内存使用率OID<span class="text-muted">（可以只填写内存使用率OID。也支持填写表达式计算内存使用率，如：[1.3.6.1.4.1.9.9.48.1.1.1.6]/[1.3.6.1.4.1.9.9.48.1.1.1.5]*100，表达式中OID要用方括号括起来）</span></label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.memSizeOID}" class="validate[maxSize[300]] form-control" name="memSizeOID" id="memSizeOID" placeholder="1.3.6.1.4.1.9.9.48.1.1.1.6">
                </div>
                <div class="form-group">
                    <label>设备运行温度OID<span class="text-muted"></span></label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.temperatureOid}" class="validate[maxSize[100]] form-control" name="temperatureOid" id="temperatureOid" placeholder="">
                </div>
                <div class="form-group">
                    <label>接口状态OID<span class="text-muted">（一般为1.3.6.1.2.1.2.2.1.8）</span></label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.ifOperStatusOid}" class="validate[maxSize[100]] form-control" name="ifOperStatusOid" id="ifOperStatusOid" placeholder="">
                </div>
                <div class="form-group">
                    <label>设备运行时间OID<span class="text-muted">（一般为1.3.6.1.6.3.10.2.1.3.0，返回时间单位为秒）</span></label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.voltageOid}" class="validate[maxSize[100]] form-control" name="voltageOid" id="voltageOid" placeholder="">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" autocomplete="off"  th:value="${snmpInfo.remark}" class="validate[maxSize[50]] form-control" name="remark" id="remark" placeholder="如交换机01">
                </div>
                <div class="form-group">
                    <label><font color="red">*</font>告警级别</label>
                    <div th:replace="common/warnLevel.html"></div>
                </div>
                <div class="form-group clearfix">
                    <label><font color="red">*</font>监控状态</label>
                    <div th:replace="common/activeRadio.html"></div>
                </div>
            </div>
            <!-- /.card-body -->

            <div class="card-footer">
                <button type="submit" class="btn btn-primary btn-sm" style="margin-right:10px;"><i class="fas fa-save"></i> 保 存</button>
                <button type="button"  th:onclick="goback()"  class="btn bg-danger btn-sm"><i class="fas fa-backward"></i> 返 回</button>
                <button type="button"  data-toggle="modal"  data-target="#modal-default" class="btn btn-primary btn-sm float-right">测试OID</button>
            </div>

        </form>
      <!-- /.card-body -->
    </div>
    <!-- /.card -->


  </div><!-- /.col-md-12 -->

        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </section><!-- /.content -->
  </div><!-- /.content-wrapper -->


  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->
<div class="modal fade" id="modal-default">
    <div class="modal-dialog">
        <div class="modal-content" style="font-size:0.90rem">
            <div class="modal-header">
                <h4 class="modal-title">测试获取OID结果</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p>
                    <input type="text"  autocomplete="off" class="form-control" name="testOid" id="testOid" placeholder="输入OID">
                    <div class="input-group">
                        <div class="icheck-primary d-inline">
                            <input type="radio" id="radioPrimaryGet" name="snmpType" value="SNMPGET" checked>
                            <label for="radioPrimaryGet"><span style="opacity:.70">SNMPGET</span></label>
                        </div>
                        <div class="icheck-danger d-inline" style="margin-left:30px;">
                            <input type="radio" id="radioPrimaryWalk"  name="snmpType" value="SNMPWALK">
                            <label for="radioPrimaryWalk"><span style="opacity:.70">SNMPWALK</span></label>
                        </div>
                    </div>
                <div class="input-group" id="testResultData"></div>
                </p>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-default  btn-sm" data-dismiss="modal">关 闭</button>
                <button type="button" onclick="ajaxTestData()" class="btn btn-primary btn-sm">测试获取</button>
            </div>
        </div>
        <!-- /.modal-content -->
    </div>
    <!-- /.modal-dialog -->
</div>
<script th:src="@{'/static/js/snmp.js?v=3.6.4'}"></script>
<script th:inline="javascript">
    $(document).ready(function(){
        $("#form1").validationEngine();
        var warnLevel = [[${snmpInfo.warnLevel}]];
        $("input[name='warnLevel'][value='"+warnLevel+"']").attr('checked','true');
        var active = [[${snmpInfo.active}]];
        $("input[name='active'][value='"+active+"']").attr('checked','true');
        var snmpVersion = [[${snmpInfo.snmpVersion}]];
        $("input[name='snmpVersion'][value='"+snmpVersion+"']").attr('checked','true');
        if('3'==snmpVersion){
            $("#snmpV3InfoDev").show();
        }
        $('input[name="snmpVersion"]').change(function() {
            if (this.checked) {
                if('3'==$(this).val()){
                    $("#snmpV3InfoDev").show();
                }else{
                    $("#snmpV3InfoDev").hide();
                }
            }
        });
    });
</script>
</body>
</html>
