<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>

</head>
<body th:class="${session.sidebarCollapse}">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>

  <!-- Content Wrapper. Contains page content -->
  <div th:class="'content-wrapper '+${session.themeNameSign}" style="font-size:0.90rem">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1></h1>
          </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item active"></li>
                </ol>
            </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

  <div class="col-md-11">
    <div th:class="'card card-primary '+${session.themeNameSign}">
      <div class="card-header">
        <h3 class="card-title">添加设备账号信息</h3>
          <div class=" float-sm-right">
              <a href="javascript:history.back()">返回上级</a>
          </div>
      </div>
      <!-- /.card-header -->
      <!-- form start -->
        <form role="form" id="form1" method="post" th:action="@{'/passwdInfo/save'}">
            <input type="hidden" name="id" th:value="${passwdInfo.id}"/>
            <div class="card-body">
                    <div class="form-group">
                        <label><font color="red">*</font>设备名称</label>
                        <input type="text" autocomplete="off"  th:value="${passwdInfo.hostname}" class="validate[required,maxSize[50]] form-control" name="hostname" id="hostname" placeholder="">
                    </div>
                    <div class="form-group">
                        <label>标识<span class="text-muted">（比如可以填写设备的IP。如果IP和监控主机列表的IP相同，系统会自动进行关联）</span></label>
                        <input type="text" autocomplete="off"  th:value="${passwdInfo.hostMark}" class="validate[maxSize[50]] form-control" name="hostMark" id="hostMark" placeholder="">
                    </div>
                    <div class="form-group">
                        <label>账号<span  class="btncopy" data-clipboard-action="copy"  data-clipboard-target="#hostAccount" data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="复制密码" style="cursor:pointer;margin-left: 10px"><i class="fa fa-copy"></i></span></label>
                        <input type="text" autocomplete="off"  th:value="${passwdInfo.hostAccount}" class="validate[maxSize[50]] form-control" name="hostAccount" id="hostAccount" placeholder="">
                    </div>
                    <div class="form-group">
                        <label>密码 <span  class="btncopy" data-clipboard-action="copy"  data-clipboard-target="#hostPasswd" data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="复制密码" style="cursor:pointer;margin-left: 10px"><i class="fa fa-copy"></i></span>
                            <span  data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="显示密码" onclick="javascript:showPasswd();" style="cursor:pointer;margin-left: 10px"><i id="eyeSwitch" class="fa fa-eye"></i></span>
                            </label>
                        <input type="text" autocomplete="off"  th:value="${passwdInfo.hostPasswd}" class="validate[maxSize[50]] form-control" name="hostPasswd" id="hostPasswd" placeholder="请输入登录密码">
                    </div>
                    <div class="form-group">
                        <label>备注</label>
                        <textarea class="validate[maxSize[300]] form-control"   name="hostRemark" id="hostRemark" th:text="${passwdInfo.hostRemark}"  rows="6" placeholder=''></textarea>
                    </div>

            </div>
            <!-- /.card-body -->

            <div class="card-footer">
                <button type="submit" class="btn btn-primary btn-sm" style="margin-right:10px;"><i class="fas fa-save"></i> 保 存</button>
                <button type="button"  th:onclick="goback()"  class="btn bg-danger btn-sm"><i class="fas fa-backward"></i> 返 回</button>
            </div>

        </form>
      <!-- /.card-body -->
    </div>
    <!-- /.card -->


  </div><!-- /.col-md-10 -->

        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </section><!-- /.content -->
  </div><!-- /.content-wrapper -->


  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->

<script th:src="@{'/static/js/passwdInfo.js?v=3.5.0'}"></script>
<script th:inline="javascript">
    $(document).ready(function(){
        $("#form1").validationEngine();
        var clipboard = new ClipboardJS('.btncopy');
        clipboard.on('success', function (e) {
            toastr.success("复制成功");
        });
    });

</script>
</body>
</html>
