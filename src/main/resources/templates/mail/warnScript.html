<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>

</head>
<body th:class="${session.sidebarCollapse}">

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>


  <!-- Content Wrapper. Contains page content -->
  <div th:class="'content-wrapper '+${session.themeNameSign}" style="font-size:0.90rem">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
          </div><!-- /.col -->
          <!-- <div class="col-sm-6">
             <ol class="breadcrumb float-sm-right">
               <li class="breadcrumb-item"><a href="#">Home</a></li>
               <li class="breadcrumb-item active">Dashboard v1</li>
             </ol>
           </div>--><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
          <div class="col-md-10">
          <div th:class="'card card-primary '+${session.themeNameSign}">
              <div class="card-header">
                  <h3 class="card-title"><i class="nav-icon fas fa-keyboard"></i>&nbsp;告警脚本测试</h3>
                  <div class=" float-sm-right">
                      <a href="javascript:history.back()">返回上级</a>
                  </div>
              </div>
              <form role="form" id="form1" method="post" th:action="@{'/warnScript/test'}">
              <div class="card-body">
                  <div class="form-group"><span class="text-muted">提示：告警脚本需要在server配置文件中进行配置，配置完成后重启server程序后生效</span></div>
                  <div class="form-group">
                      <label>告警脚本<span class="text-muted">（若配置脚本，无论是否配置过邮件告警，都会执行该脚本）</span></label>
                      <div class="row">
                          <div class="col-12 table-responsive">
                              <div style="line-height:0.9;margin-left:10px;margin-right:10px;font-size:1rem" class="language-html highlighter-rouge"><div class="highlight"><pre class="highlight">
<code>  warnScript: <span class="nt" th:text="${warnScript}"></span></code></pre></div></div>
                              <!-- /.col -->
                          </div>
                      </div>
                  </div>
                  <div class="form-group">
                      <label>告警恢复脚本<span class="text-muted">（若配置脚本，则此脚本只会发送恢复消息，上面告警脚本只会发送告警消息。若不配置该选项，则告警和恢复消息都会由上面告警脚本发送）</span></label>
                      <div class="row">
                          <div class="col-12 table-responsive">
                              <div style="line-height:0.9;margin-left:10px;margin-right:10px;font-size:1rem" class="language-html highlighter-rouge"><div class="highlight"><pre class="highlight">
<code>  recoverScript: <span class="nt" th:text="${recoverScript}"></span></code></pre></div></div>
                              <!-- /.col -->
                          </div>
                      </div>
                  </div>
                  <div class="form-group">
                      <label>输入测试信息内容</label>
                      <input type="text"  autocomplete="off" value="测试发送一条告警通知消息" class="validate[required,maxSize[50]] form-control" name="scriptContent" id="scriptContent" placeholder="测试信息">
                  </div>
                  <label><span class="text-muted">提示：如果提示发送成功，但是没有收到消息，那说明系统已经成功调用告警脚本了，可能是脚本内有其他逻辑错误。我们可以在脚本内先把告警消息输出到一个测试log文件，再一步步调试。</span></label>
              </div>

              <div class="card-footer">
                  <button type="button" onclick="test()" class="btn btn-primary btn-sm" style="margin-right:10px;">测试发送</button>
                  <button type="button"  th:onclick="goback()"  class="btn bg-danger btn-sm"><i class="fas fa-backward"></i> 返 回</button>
              </div>
              </form>
          </div>
          </div>


      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->

<script th:inline="javascript">
    function test() {
        var warnScript =  [[${warnScript}]];
        if(''==warnScript){
            toastr.info("请先在server配置文件配置告警脚本");
            return;
        }
        var scriptContent = $("#scriptContent").val();
        if(''==scriptContent){
            toastr.info("输入测试信息内容");
            return;
        }
        $("#form1").ajaxSubmit(function(message) {
            if('success'==message){
                toastr.success("发送完成，请查收消息");
            }else{
                toastr.error("发送好像出错了，请检查。"+message);
            }
        });
    }
</script>

</body>
</html>
