<div th:if="${not #lists.isEmpty(cpuTemperaturesList)}">
    <label><span  style="margin-left: 10px;color:#fff;background:#508ff4;display:inline-block;border-radius:3px;padding:4px 8px;">CPU温度</span>
        <span style="margin-left:30px;"  data-trigger="hover" data-container="body" data-toggle="popover" data-placement="top" data-content="告警阈值">告警阈值: </span><span class="description-percentage text-danger" style="margin-left:5px;margin-right:30px;"><span th:text="${cpuTemperatureWarnVal}">17</span></span></label>
    <div class="row">
        <div class="col-12 table-responsive">
            <div style="line-height:0.9;margin-left:10px;margin-right:10px;font-size:1rem" class="language-html highlighter-rouge"><div class="highlight"><pre class="highlight">
                <code>
<th:block th:each="item : ${cpuTemperaturesList}">
<span th:text="${item.core_index}"></span>： 当前：<span class="na" th:text="${item.input}"></span>℃，最高：<span class="s" th:text="${item.max}"></span>℃，临界值：<span class="nt" th:text="${item.crit}"></span>℃
</th:block>
                </code></pre></div></div>
            <!-- /.col -->
        </div>
    </div>
</div>
