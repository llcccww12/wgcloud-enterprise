<style>
    .widget-content {
        align-items: center;
        flex-direction: row;
        padding: 1rem;
        font-family: muli,sans-serif;
    }
    .widget-content .widget-content-outer {
        display: flex;
        flex: 1 1;
        flex-direction: column;
    }
    .widget-content .widget-content-wrapper {
        align-items: center;
        display: flex;
        flex: 1 1;
        position: relative;
    }
    .widget-content .widget-content-left .widget-heading {
        font-weight: 900;
        /**opacity: .8;**/
    }
    .widget-content .widget-content-left .widget-subheading {
        /**opacity: .5;**/
        font-size:.88rem;
        cursor:pointer;
    }
    .sub-label-left {
        font-size:.88rem;
    }
    .widget-content .widget-content-right {
        margin-left: auto;
    }
    .widget-content .widget-numbers {
        display: block;
        font-size: 1.8rem;
        font-weight: 900;
    }
    .widget-content .widget-progress-wrapper {
        margin-top: 1rem;
    }
    .progress.progress-bar-sm {
        height: 0.5rem;
    }
    .progress, .progress-bar {
        display: flex;
        overflow: hidden;
    }
    .progress {
        background-color: #fff;
        border-radius: 0.25rem;
        font-size: .66rem;
        height: 1rem;
    }
    .progress .progress-bar:last-child {
        border-bottom-right-radius: 0.25rem;
        border-top-right-radius: 0.25rem;
    }
    .progress-bar {
        background-color: #545cd8;
        color: #fff;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        transition: width .6s ease;
        white-space: nowrap;
    }
    .progress, .progress-bar {
        display: flex;
        overflow: hidden;
    }
    .widget-content .widget-progress-wrapper .progress-sub-label {
        align-content: center;
        align-items: center;
        display: flex;
        margin-top: 0.3333333333rem;
        /**opacity: .5;**/
    }
    .widget-content .widget-progress-wrapper .progress-sub-label .sub-label-right {
        margin-left: auto;
    }
    .bg-danger {
        background-color: #e83e8c!important;
    }
    .bg-danger-log {
        background-color: #4099ff!important;
    }
    .bg-arielle-smile {
        background-image: radial-gradient(circle 248px at center,#16d9e3 0,#30c7ec 47%,#46aef7 100%)!important
    }
    .bg-happy-green {
        background-image: linear-gradient(180deg,#00b09b,#96c93d)!important
    }
    .bg-warm-flame {
        background-image: linear-gradient(45deg,#ff9a9e,#fad0c4 99%,#fad0c4)!important
    }
    .bg-love-kiss {
        background-image: linear-gradient(0deg,#ff0844 0,#ffb199)!important
    }
    .bg-plum-plate {
        background-image: linear-gradient(135deg,#667eea,#764ba2)!important
    }
    .bg-mean-fruit {
        background-image: linear-gradient(120deg,#fccb90,#d57eeb)!important
    }

    .bg-happy-fisher {
        background-image: linear-gradient(120deg,#89f7fe,#66a6ff)!important
    }

    .bg-happy-itmeo {
        background-image: linear-gradient(180deg,#2af598,#009efd)!important
    }

    .bg-mixed-hopes {
        background-image: linear-gradient(0deg,#c471f5 0,#fa71cd)!important
    }

    .bg-strong-bliss {
        background-image: linear-gradient(90deg,#f78ca0 0,#f9748f 19%,#fd868c 60%,#fe9a8b)!important
    }
    .bg-night-fade {
        background-image: linear-gradient(0deg,#a18cd1 0,#fbc2eb)!important
    }
    .bg-sunny-morning {
        background-image: linear-gradient(120deg,#f6d365,#fda085)!important
    }
    .bg-tempting-azure {
        background-image: linear-gradient(120deg,#84fab0,#8fd3f4)!important
    }

    .bg-amy-crisp {
        background-image: linear-gradient(120deg,#a6c0fe,#f68084)!important
    }
    .bg-grow-early {
        background-image: linear-gradient(0deg,#0ba360 0,#3cba92)!important
    }
    .bg-heavy-rain {
        background-image: linear-gradient(0deg,#cfd9df 0,#e2ebf0)!important
    }
</style>
<!-- Small boxes (Stat box) -->
<div class="row">

    <div class="col-lg-3">
        <div style="color:#fff;" class="small-box widget-content bg-happy-green">
            <div class="widget-content-outer">
                <div class="widget-content-wrapper">
                    <div class="widget-content-left">
                        <div class="widget-heading">进程</div>
                        <th:block th:if="${session.LOGIN_KEY != null && #strings.contains(session.LOGIN_KEY.menuIds,',13,')}">
                            <div class="widget-subheading" onclick="hrefTopUrl('/appInfo/list')">监控业务进程、中间件</div>
                        </th:block>
                        <th:block th:if="${session.LOGIN_KEY == null || (session.LOGIN_KEY != null && !#strings.contains(session.LOGIN_KEY.menuIds,',13,'))}">
                            <div class="widget-subheading">监控业务进程、中间件</div>
                        </th:block>
                    </div>
                    <div class="widget-content-right"><div th:text="${totalSizeApp}" class="widget-numbers">1896</div></div></div>
                <div class="widget-progress-wrapper"><div class="progress-bar-sm progress">
                    <div class="progress-bar bg-danger" role="progressbar" aria-valuenow="71" aria-valuemin="0" aria-valuemax="100" th:style="'width:' + ${onLineAppPer}+'%'"></div></div>
                    <div class="progress-sub-label"><div class="sub-label-left">在线<span th:text="${onLineAppSize}"></span></div><div class="sub-label-right" th:text="${onLineAppPer}+'%'">100%</div></div></div>
            </div>
        </div>
    </div>

    <div class="col-lg-3">
        <div style="color:#fff;" class="small-box widget-content bg-arielle-smile">
            <div class="widget-content-outer">
                <div class="widget-content-wrapper">
                    <div class="widget-content-left">

                        <th:block th:if="${session.LOGIN_KEY != null && #strings.contains(session.LOGIN_KEY.menuIds,',14,')}">
                            <div class="widget-subheading" onclick="hrefTopUrl('/dockerInfo/list')">容器监测</div>
                        </th:block>
                        <th:block th:if="${session.LOGIN_KEY == null || (session.LOGIN_KEY != null && !#strings.contains(session.LOGIN_KEY.menuIds,',14,'))}">

                        </th:block>
                    </div>
                    <div class="widget-content-right"><div th:text="${dockerSize}" class="widget-numbers">1896</div></div></div>
                <div class="widget-progress-wrapper"><div class="progress-bar-sm progress">
                    <div class="progress-bar bg-danger" role="progressbar" aria-valuenow="71" aria-valuemin="0" aria-valuemax="100" th:style="'width:' + ${dockerOnLinePer}+'%'"></div></div>
                    <div class="progress-sub-label"><div class="sub-label-left">在线<span th:text="${dockerOnLineSize}"></span></div><div class="sub-label-right" th:text="${dockerOnLinePer}+'%'">100%</div></div></div>
            </div>
        </div>
    </div>

    <div class="col-lg-3">
        <div style="color:#fff;" class="small-box widget-content bg-arielle-smile">
            <div class="widget-content-outer">
                <div class="widget-content-wrapper">
                    <div class="widget-content-left">
                        <div class="widget-heading">数据库</div>
                        <th:block th:if="${session.LOGIN_KEY != null && #strings.contains(session.LOGIN_KEY.menuIds,',4,')}">
                            <div class="widget-subheading" onclick="hrefTopUrl('/dbInfo/list')">数据监测</div>
                        </th:block>
                        <th:block th:if="${session.LOGIN_KEY == null || (session.LOGIN_KEY != null && !#strings.contains(session.LOGIN_KEY.menuIds,',4,'))}">
                            <div class="widget-subheading">数据监测</div>
                        </th:block>
                    </div>
                    <div class="widget-content-right"><div th:text="${dbInfoSize}" class="widget-numbers">1896</div></div></div>
                <div class="widget-progress-wrapper"><div class="progress-bar-sm progress">
                    <div class="progress-bar bg-danger" role="progressbar" aria-valuenow="71" aria-valuemin="0" aria-valuemax="100" th:style="'width:' + ${dbInfoOnLinePer}+'%'"></div></div>
                    <div class="progress-sub-label"><div class="sub-label-left">在线<span th:text="${dbInfoOnLineSize}"></span></div><div class="sub-label-right" th:text="${dbInfoOnLinePer}+'%'">100%</div></div></div>
            </div>
        </div>
    </div>

    <div class="col-lg-3">
        <div style="color:#fff;" class="small-box widget-content bg-arielle-smile">
            <div class="widget-content-outer">
                <div class="widget-content-wrapper">
                    <div class="widget-content-left">
                        <div class="widget-heading">PING</div>
                        <th:block th:if="${session.LOGIN_KEY != null && #strings.contains(session.LOGIN_KEY.menuIds,',6,')}">
                            <div class="widget-subheading" onclick="hrefTopUrl('/dceInfo/list')">网络设备、网关链路监测</div>
                        </th:block>
                        <th:block th:if="${session.LOGIN_KEY == null || (session.LOGIN_KEY != null && !#strings.contains(session.LOGIN_KEY.menuIds,',6,'))}">
                            <div class="widget-subheading">网络设备、网关链路监测</div>
                        </th:block>
                    </div>
                    <div class="widget-content-right"><div th:text="${dceSize}" class="widget-numbers">1896</div></div></div>
                <div class="widget-progress-wrapper"><div class="progress-bar-sm progress">
                    <div class="progress-bar bg-danger" role="progressbar" aria-valuenow="71" aria-valuemin="0" aria-valuemax="100" th:style="'width:' + ${dceOnLinePer}+'%'"></div></div>
                    <div class="progress-sub-label"><div class="sub-label-left">在线<span th:text="${dceOnLineSize}"></span></div><div class="sub-label-right" th:text="${dceOnLinePer}+'%'">100%</div></div></div>
            </div>
        </div>
    </div>

</div>
<!-- /.row -->
