<!DOCTYPE html>
<html>
<head>
    <title th:text="${application.wgName}">cac监控系统</title>
    <div  th:replace="common/header.html"></div>



</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

    <!-- Content Wrapper. Contains page content -->
    <div th:class="'content-wrapper '+${session.themeNameSign}" style="margin-left: 10px;font-size:0.90rem">
        <!-- Content Header (Page header) -->
        <section class="content-header" >
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <a href="javascript:location.reload();">
                            <img th:src="${application.logoUrl}" style="height:25px;width:25px;opacity: .8" class="brand-image img-circle elevation-3">&nbsp;<span style="vertical-align:bottom;" th:text="${application.wgName}">cac</span>
                        </a>
                    </div>
                    <div class="col-sm-6">
                    </div>
                </div>
            </div><!-- /.container-fluid -->
        </section>

        <!-- Main content -->
        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-12">
                            <div class="card-body">
                                <form role="form" id="form1" method="post" th:action="@{'/AIPage/analyze'}">
                                <div class="form-group"><textarea class="form-control" name="questionContent" id="questionContent"></textarea></div>
                                    <textarea style="display:none" name="questionData" id="questionData"></textarea>
                                </form>
                                <div class="form-group row">
                                            <div class="col-md-3">&nbsp;</div>
                                            <div class="col-md-6">
                                                <button type="button" onclick="ajaxSaveRemark()" class="btn btn-primary" style="margin-right:20px;">开始推理分析</button>
                                                <button type="button" onclick="resetInput()" class="btn btn-primary" style="margin-right:20px;">清空内容</button>
                                                <button type="button" id="lineWarpDiv" onclick="setLineWrap()" class="btn btn-primary" style="margin-right:20px;">自动换行</button>
                                                <button type="button" onclick="copy()" class="btn btn-primary">复制结果</button>
                                            </div>
                                            <div class="col-md-3">&nbsp;</div>
                                </div>
                                <div class="form-group"><textarea class="form-control" name="answerContent" id="answerContent"></textarea></div>
                            </div>
                        <!-- /.card -->


                    </div><!-- /.col-md-12 -->

                </div><!-- /.row -->
            </div><!-- /.container-fluid -->
        </section><!-- /.content -->
    </div><!-- /.content-wrapper -->


    <div th:replace="common/footerDashView.html"></div>

</div>
<!-- ./wrapper -->
<script th:src="@{'/static/js/jQuery/jquery.form.min.js'}" type="text/javascript" charset="utf-8"></script>
<div th:replace="common/codemirror.html"></div>
<script th:inline="javascript">
    var editor = CodeMirror.fromTextArea(document.getElementById("questionContent"), {
        lineNumbers: true,
        styleActiveLine: true,
        matchBrackets: true
    });
    editor.setOption("theme", "dracula");
    editor.setSize('auto','150px');
    var editor2 = CodeMirror.fromTextArea(document.getElementById("answerContent"), {
        mode: 'markdown',
        lineNumbers: true,
        styleActiveLine: true,
        matchBrackets: true
    });
    editor2.setOption("theme", "dracula");
    editor2.setSize('auto','690px');

    function resetInput(){
        editor.setValue("");
        editor2.setValue("");
        $("#questionData").val("");
    }

    function ajaxSaveRemark() {
        var data = editor.getValue();
        if(data==""){
            toastr.info("请输入内容");
            return;
        }
        editor2.setValue("正在推理分析，请稍后......");
        $("#questionData").val(editor.getValue());
        $("#form1").ajaxSubmit(function(message) {
            editor2.setValue(message);
        });
    }

    var lineWarpSign = "0";
    function setLineWrap(){
        if(lineWarpSign=="0"){
            editor2.setOption("lineWrapping", true);
            lineWarpSign = "1";
            $("#lineWarpDiv").html("取消换行");
        }else{
            editor2.setOption("lineWrapping", false);
            lineWarpSign = "0";
            $("#lineWarpDiv").html("自动换行");
        }
        toastr.success("操作完成");
    }

    function copy(){
        var input = document.createElement('input');// 创建input对象
        input.value = editor2.getValue(); // 设置复制内容
        document.body.appendChild(input); // 添加临时实例
        input.select(); // 选择实例内容
        document.execCommand('Copy'); // 执行复制
        document.body.removeChild(input); // 删除临时实例
        toastr.success("复制成功");
    }
    var msg = [[${msg}]];
    if(msg!='' && msg!=null){
        toastr.info(msg);
    }
</script>

</body>
</html>
