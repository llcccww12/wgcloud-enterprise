<!DOCTYPE html>
<html>
<head>
    <title th:text="${application.wgName}">cac监控系统</title>
  <div  th:replace="common/header.html"></div>



</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

  <!-- Content Wrapper. Contains page content -->
  <div th:class="'content-wrapper '+${session.themeNameSign}" style="margin-left: 10px;font-size:0.90rem">
    <!-- Content Header (Page header) -->
    <section class="content-header" >
      <div class="container-fluid">
        <div class="row mb-2">

            <div class="col-sm-6">
                <a href="javascript:location.reload();">
                    <img th:src="${application.logoUrl}" style="height:25px;width:25px;opacity: .8" class="brand-image img-circle elevation-3">&nbsp;<span style="vertical-align:bottom;" th:text="${application.wgName}">cac</span>
                </a>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item "><a th:href="@{'/dash/main?dashView=1'}">监控概要</a></li>
                    <li class="breadcrumb-item "><a th:href="@{'/systemInfo/systemInfoList?dashView=1'}">主机列表</a></li>
                </ol>
            </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

  <div class="col-md-12">
    <div th:class="'card card-primary '+${session.themeNameSign}">
      <div class="card-header">
        <h3 class="card-title"><span th:utext="${systemInfo.image}"></span><span th:text="${systemInfo.hostname}"></span>
            <th:block th:if="${systemInfo.remark ne '' && systemInfo.remark ne null}">
                (备注：<span th:text="${systemInfo.remark}"></span>)
            </th:block></h3>
          <div class=" float-sm-right">
              <a href="javascript:history.back()">返回上级</a>
          </div>
      </div>
      <!-- /.card-header -->
      <!-- form start -->
      <form role="form">
        <div class="card-body">
          <div class="form-group">
            <label><span style="color:#fff;background:#0dcaf0;display:inline-block;border-radius:3px;padding:4px 8px;">系统信息</span></label>
              <div><strong>主机名称：</strong><span th:text="${systemInfo.hostnameExt}"></span>，<strong>系统描述：</strong><span th:text="${systemInfo.platForm}"></span>，<strong>版本：</strong><span th:text="${systemInfo.platformVersion}"></span>，<strong>KernelArch：</strong><span th:text="${systemInfo.kernelArch}"></span>，<strong>CPU核数：</strong><span th:text="${systemInfo.cpuCoreNum}"></span>
                  ，<strong>CPU型号：</strong><span th:text="${systemInfo.cpuXh}"></span> ，<strong>运行进程数量：</strong><span th:text="${systemInfo.procs}"></span>，<strong>物理总内存：</strong><span th:text="${systemInfo.totalMem}"></span>
                  ，<strong>CPU PhysicalId：</strong><span th:text="${systemInfo.cpuPhysicalid}"></span>，<strong>CPU Family：</strong><span th:text="${systemInfo.cpuFamily}"></span>，<strong>CPU Mhz：</strong><span th:text="${systemInfo.cpuMhz}"></span>
                  ，<strong>交换区总内存：</strong><span th:text="${systemInfo.totalSwapMem}"></span>，<strong>交换区内存已使用：</strong><span th:text="${systemInfo.swapMemPer}"></span>%
                  ，<strong>启动时间：</strong><span th:text="${systemInfo.bootTimeStr}"></span>，<strong>运行时间：</strong><span th:text="${systemInfo.uptimeStr}"></span>，<strong>备注：</strong><span th:text="${systemInfo.remark}"></span>
                  ，<strong>总计接收流量：</strong><span th:text="${systemInfo.bytesRecv}+'G'"></span>，<strong>总计发送流量：</strong><span th:text="${systemInfo.bytesSent}+'G'"></span>
                  ，<strong>agent版本：</strong><span th:text="${systemInfo.agentVer}"></span>，<strong>agent上报时间(秒)：</strong><span th:text="${systemInfo.submitSeconds}"></span></div>
          </div>
        </div>
        <!-- /.card-body -->
      </form>
      <!-- /.card-body -->

        <div th:replace="common/cpuTemperatures.html"></div>


        <label><span style="margin-left: 10px;color:#fff;background:#508ff4;display:inline-block;border-radius:3px;padding:4px 8px;">磁盘空间信息</span></label>
        <div class="row">
            <div class="col-12 table-responsive">
                <div th:replace="common/disk.html"></div>
            </div>
        </div>

        <div th:if="${not #lists.isEmpty(diskIoList)}">
            <label><span style="margin-left: 10px;color:#fff;background:#9267ff;display:inline-block;border-radius:3px;padding:4px 8px;">磁盘IO信息</span></label>
            <div class="row">
                <div class="col-12 table-responsive">
                    <div th:replace="common/diskio.html"></div>
                </div>
            </div>
        </div>

        <div th:if="${not #lists.isEmpty(diskSmartList)}">
            <label><span style="margin-left: 10px;color:#fff;background:#508ff4;display:inline-block;border-radius:3px;padding:4px 8px;">磁盘SMART信息</span></label>
            <div class="row">
                <div class="col-12 table-responsive">
                    <div th:replace="common/disksmart.html"></div>
                </div>
            </div>
        </div>

    </div>
    <!-- /.card -->


  </div><!-- /.col-md-12 -->

        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </section><!-- /.content -->
  </div><!-- /.content-wrapper -->


  <div th:replace="common/footerDashView.html"></div>

</div>
<!-- ./wrapper -->

<script th:src="@{'/static/js/host.js?v=3.5.0'}"></script>


</body>
</html>
