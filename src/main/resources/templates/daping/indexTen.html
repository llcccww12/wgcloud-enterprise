<!DOCTYPE html>
<html>
<head>
  <title th:text="${application.wgName}">cac监控系统</title>
  <base href="./" th:href="'/'"/>
  <meta charset="utf-8">
  <link rel="shortcut icon" type="image/x-icon" th:href="${application.icoUrl}"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <!-- Tell the browser to be responsive to screen width -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Font Awesome -->
  <link rel="stylesheet" th:href="@{'/static/dapingTen/css/v10.css'}">
</head>
<body>
<div class="container-header">
  <ul class="nowTime">
    <li></li>
    <li></li>
  </ul>
  <div class="location">
    <i class="icon iconfont icon-buoumaotubiao23"></i>
    <span class="areaName"></span>
  </div>
  <h3 th:text="${application.wgName}">cac监控系统</h3>
</div>
<div class="container-content">
  <div class="top">
    <div class="count-base" >
      <div class="com-count-title">监控资源总量构成</div>
      <div class="com-screen-content">
        <div id="main1" style="width:100%;height:300px;"></div>
      </div>
      <span class="left-top"></span>
      <span class="right-top"></span>
      <span class="left-bottom"></span>
      <span class="right-bottom"></span>
    </div>
    <div class="count-resource q1">
      <div class="com-count-title">资源总量统计</div>
      <div class="com-screen-content2">
        <ul class="use-data">
          <li>
            <p class="data-count" th:text="${cpuCoresSum}">1</p>
            <span class="data-name">CPU核数总和</span>
          </li>
          <li>
            <p class="data-count" th:text="${memSum}">1</p>
            <span class="data-name">内存总和</span>
          </li>
          <li>
            <p class="data-count" th:text="${sumDiskSizeCache}">1</p>
            <span class="data-name">磁盘容量总和</span>
          </li>
        </ul>
        <div class="com-screen-content">
          <div id="main2" style="margin-top:10px;width:100%;height:240px;"></div>
        </div>
        <span class="left-top"></span>
        <span class="right-top"></span>
        <span class="left-bottom"></span>
        <span class="right-bottom"></span>
      </div>
    </div>
    <div class="count-resource q2">
      <div class="com-count-title">基础库统计</div>
      <div class="com-screen-content">
        <ul class="data-label">
        </ul>
        <ul class="use-data">
          <li><p class="data-count" th:text="${heathSize}">1</p><span class="data-name">监控接口</span></li>
          <li><p class="data-count" th:text="${shellInfoSize}">1</p><span class="data-name">下发指令</span></li>
          <li><p class="data-count" th:text="${dbTableSize}">1</p><span class="data-name">数据表监控</span></li>
        </ul>
        <div id="main3" style="margin-top:10px;width:100%;height:240px;"></div>
      </div>
      <span class="left-top"></span>
      <span class="right-top"></span>
      <span class="left-bottom"></span>
      <span class="right-bottom"></span>
    </div>
  </div>

  <div class="mid">
    <div class="count-share w1" style="margin-top:30px;">
      <div class="com-count-title">主机运行状态</div>
      <div class="com-screen-content">
        <div class="topRec_List">
          <dl>
            <dd>主机IP</dd>
            <dd>状态</dd>
            <dd>更新时间</dd>
          </dl>
          <div class="maquee">
            <ul>
              <th:block th:each="item,iterStat : ${systemInfoList}">
                <li>
                  <div th:text="${item.hostname}"></div>
                  <th:block th:if="${item.state  != '2'}">
                    <div style="color:#3AFF57">正常</div>
                  </th:block>
                  <th:block th:if="${item.state  == '2'}">
                    <div style="color:#dc3545">离线</div>
                  </th:block>
                  <div th:text="${#dates.format(item.createTime,'yyyy-MM-dd HH:mm:ss')}"></div>
                </li>
              </th:block>
            </ul>
          </div>
        </div>
      </div>
      <span class="left-top"></span>
      <span class="right-top"></span>
      <span class="left-bottom"></span>
      <span class="right-bottom"></span>
    </div>
    <div class="count-share w2" style="margin-top:30px;">
      <div class="com-count-title">系统类型分布</div>
      <div class="com-screen-content">
        <div id="main5" style="width:100%;height:300px;"></div>
      </div>
      <span class="left-top"></span>
      <span class="right-top"></span>
      <span class="left-bottom"></span>
      <span class="right-bottom"></span>
    </div>
  </div>

  <div class="bottom">
    <div class="count-topic e1" >
      <div class="com-count-title">主机磁盘总使用率%统计</div>
      <div class="com-screen-content">
        <div id="main6" style="width:100%;height:300px;"></div>
      </div>
      <span class="left-top"></span>
      <span class="right-top"></span>
      <span class="left-bottom"></span>
      <span class="right-bottom"></span>
    </div>
    <div class="count-topic e2" >
      <div class="com-count-title">主机运行进程统计</div>
      <div class="com-screen-content">
        <div id="main7" style="width:100%;height:300px;"></div>
      </div>
      <span class="left-top"></span>
      <span class="right-top"></span>
      <span class="left-bottom"></span>
      <span class="right-bottom"></span>
    </div>
  </div>
  <div class="clearfix"></div>
</div>

<script  type="text/javascript"  th:src="@{'/static/daping/js/jquery.js'}"></script>
<script  type="text/javascript"  th:src="@{'/static/dapingTen/js/echarts.min.js'}"></script>
<!-- Toastr -->
<link rel="stylesheet" th:href="@{'/static/AdminLTE/plugins/toastr/toastr.min.css'}">

    $(obj).find("ul").animate({
      marginTop : "-39px"
    },500,function(){
      $(this).css({marginTop : "0px"}).find("li:first").appendTo(this);

      }, {
        name: '平均值',
        type: 'line',
        smooth: true,
        showSymbol: false,
        lineStyle: {
          normal: {
            width: 2
          }
        },
        areaStyle: {
          normal: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
              offset: 0,
              color: 'rgba(219, 50, 51, 0.3)'
            }, {
              offset: 0.8,
              color: 'rgba(219, 50, 51, 0)'
            }], false),
            shadowColor: 'rgba(0, 0, 0, 0.1)',
            shadowBlur: 10
          }
        },
        itemStyle: {
          normal: {
            color: '#eb5690'
          }
        },
        data: [avgCpuInfo, avgMemInfo, avgDiskPer, avgFiveLoad, avgFifteenLoad, avgSwapMemInfo]
      },  {
        name: '最低值',
        type: 'line',
        smooth: true,
        showSymbol: false,
        lineStyle: {
          normal: {
            width: 2
          }
        },
        areaStyle: {
          normal: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{

              color: 'rgba(0, 136, 212, 0.3)'

              offset: 0.8,
              color: 'rgba(0, 136, 212, 0)'
            }], false),
            shadowColor: 'rgba(0, 0, 0, 0.1)',
            shadowBlur: 10
          }
        },
        itemStyle: {
          normal: {
            color: '#43bbfb'
          }
        },
        data: [minCpuInfo, minMemInfo, minDiskPer,  minFiveLoad, minFifteenLoad, minSwapMemInfo]
      }
      ]
    };
    myChart3.setOption(option);
  }

  //获取当前时间
  function getNowFormatDate() {
    var date = new Date();
    var year = date.getFullYear();
    var month = date.getMonth() + 1;
    var strDate = date.getDate();
    var Hour =  date.getHours();       // 获取当前小时数(0-23)
    var Minute =  date.getMinutes();     // 获取当前分钟数(0-59)
    var Second = date.getSeconds();     // 获取当前秒数(0-59)
    var show_day=new Array('星期日','星期一','星期二','星期三','星期四','星期五','星期六');
    var day=date.getDay();
    if (Hour<10) {
      Hour = "0" + Hour;
    }
    if (Minute <10) {
      Minute = "0" + Minute;
    }
    if (Second <10) {
      Second = "0" + Second;
    }
    if (month >= 1 && month <= 9) {
      month = "0" + month;
    }
    if (strDate >= 0 && strDate <= 9) {
      strDate = "0" + strDate;
    }
    var currentdate = '<div><p>'+year + '年' + month +'月' + strDate+'号</p><p>'+show_day[day]+'</p></div>';
    var HMS = Hour + ':' + Minute +':' + Second;
    var temp_time = year+'-'+month+'-'+strDate+' '+HMS;
    $('.nowTime li:nth-child(1)').html(HMS);
    $('.nowTime li:nth-child(2)').html(currentdate);
    //$('.topRec_List li div:nth-child(3)').html(temp_time);
    setTimeout(getNowFormatDate,1000);//每隔1秒重新调用一次该函数
  }
