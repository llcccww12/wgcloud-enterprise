<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>


</head>
<body th:class="${session.sidebarCollapse}">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>

  <!-- Content Wrapper. Contains page content -->
  <div th:class="'content-wrapper '+${session.themeNameSign}"  style="font-size:0.90rem">
    <!-- Content Header (Page header) -->
    <section class="content-header" style="height:38px">
      <div class="container-fluid">
        <div class="row mb-2" style="margin-top: -7px;">
          <div class="col-sm-6"></div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="javascript:history.back()">返回上级</a></li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

  <div class="col-md-12">
    <div th:class="'card '+${session.themeNameSign}">
      <div class="card-header">
        <h3 class="card-title"><i class="fas fa-snowflake nav-icon"></i>&nbsp;agent终端运行统计列表</h3>
        <div class=" float-sm-right">
          <!-- SEARCH FORM -->
          <form class="form-inline ml-3" th:action="@{'/agentRunState/list'}">
            <th:block th:if="${session.LOGIN_KEY.role == 'admin'}">
              <button type="button" onclick="modifyAgentConfig()" class="btn btn-primary btn-sm" style="margin-right:5px;">批量修改Agent配置参数</button>
            </th:block>
            <button type="button" onclick="exportExcel()" class="btn bg-primary btn-sm" style="margin-right:5px;">导出Excel</button>
            <button type="button" onclick="searchByOnline('')" class="btn btn-primary btn-sm" style="margin-right:5px;">全部</button>
            <button type="button" onclick="searchByOnline('1')" class="btn btn-success btn-sm" style="margin-right:5px;">在线</button>
            <button type="button" onclick="searchByOnline('2')" class="btn bg-danger btn-sm" style="margin-right:5px;">已离线</button>
            <th:block th:if="${session.LOGIN_KEY.role != 'guest'}">
              <button type="button" onclick="delChecks('/agentRunState/del')"  class="btn bg-danger btn-sm" style="margin-right:5px;">删除</button>
            </th:block>
            <div th:replace="common/groupSelect.html"></div>
            <div th:replace="common/accountSelect.html"></div>
            <div class="input-group input-group-sm">
              <input th:class="'form-control '+${session.themeNameSign}" id="hostname" name="hostname" autocomplete="off" th:value="${agentRunState.hostname}" type="text" placeholder="IP/备注/主机名称">
              <div class="input-group-append">
                <button class="btn btn-primary" type="submit">
                  <i class="fas fa-search"></i>
                </button>
              </div>
            </div>
          </form>

        </div>
      </div>
      <!-- /.card-header -->
      <div class="card-body">
        <table th:class="'table table-bordered '+${session.themeTableHoverSign}">
          <thead>
          <tr>
            <th style="width: 20px"> <input type="checkbox" value="" name="checkall" id="checkall"></th>
            <th style="width: 60px">序号</th>
            <th data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="操作系统平台">系统</th>

            <th:block th:if="${agentRunState.orderBy  == 'HOST_NAME'}">
              <th:block th:if="${agentRunState.orderType  == 'ASC'}">
                <th style="cursor:pointer" onclick="searchByOrder('HOST_NAME','DESC')">IP<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-up" style="vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
              <th:block th:if="${agentRunState.orderType  == 'DESC'}">
                <th style="cursor:pointer" onclick="searchByOrder('HOST_NAME','ASC')">IP<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-down" style="color: #dc3545!important;vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
            </th:block>
            <th:block th:if="${agentRunState.orderBy  ne 'HOST_NAME'}">
              <th style="cursor:pointer" onclick="searchByOrder('HOST_NAME','ASC')">IP<small  class="text-muted mr-1 float-right"><i class="fa-solid fa-up-down" style="vertical-align:bottom;"></i></small></th>
            </th:block>
            <th>主机名称</th>
            <th:block th:if="${agentRunState.orderBy  == 'ONLINE_TIME'}">
              <th:block th:if="${agentRunState.orderType  == 'ASC'}">
                <th style="cursor:pointer" onclick="searchByOrder('ONLINE_TIME','DESC')">累计在线时长<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-up" style="vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
              <th:block th:if="${agentRunState.orderType  == 'DESC'}">
                <th style="cursor:pointer" onclick="searchByOrder('ONLINE_TIME','ASC')">累计在线时长<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-down" style="color: #dc3545!important;vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
            </th:block>
            <th:block th:if="${agentRunState.orderBy  ne 'ONLINE_TIME'}">
              <th style="cursor:pointer" onclick="searchByOrder('ONLINE_TIME','ASC')">累计在线时长<small  class="text-muted mr-1 float-right"><i class="fa-solid fa-up-down" style="vertical-align:bottom;"></i></small></th>
            </th:block>

            <th:block th:if="${agentRunState.orderBy  == 'DOWN_TIME'}">
              <th:block th:if="${agentRunState.orderType  == 'ASC'}">
                <th style="cursor:pointer" onclick="searchByOrder('DOWN_TIME','DESC')">累计离线时长<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-up" style="vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
              <th:block th:if="${agentRunState.orderType  == 'DESC'}">
                <th style="cursor:pointer" onclick="searchByOrder('DOWN_TIME','ASC')">累计离线时长<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-down" style="color: #dc3545!important;vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
            </th:block>
            <th:block th:if="${agentRunState.orderBy  ne 'DOWN_TIME'}">
              <th style="cursor:pointer" onclick="searchByOrder('DOWN_TIME','ASC')">累计离线时长<small  class="text-muted mr-1 float-right"><i class="fa-solid fa-up-down" style="vertical-align:bottom;"></i></small></th>
            </th:block>

            <th>最后在线时间</th>
            <th th:if="${application.hostGroup == 'true'}">标签</th>
            <th th:if="${application.LICENSE_STATE eq '1' && application.userInfoManage == 'true' && session.LOGIN_KEY.role == 'admin'}">账号</th>
            <th data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="从什么时间开始统计">统计开始时间</th>
            <th>操作</th>
          </tr>
          </thead>
          <tbody>
          <th:block th:each="item,iterStat : ${page.list}">
            <tr>
              <td><input type="checkbox" th:value="${item.id}" name="todo2" th:id="${item.id}+'_check'"/></td>
              <td th:text="${iterStat.index+1}">1</td>
              <td>
                <image data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" th:data-content="${item.platForm}+'，'+${item.platformVersion}" th:src="${item.image}"></image>
              </td>
              <th:block th:if="${item.state  == '2'}">
                <td><span  data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="已离线" class="badge bg-danger"  th:text="${item.hostname}"></span></td>
              </th:block>
              <th:block th:if="${item.state  != '2'}">
                <td><span   th:id="${item.id}+'_hostname'"  th:text="${item.hostname}"></span></td>
              </th:block>
              <td><span data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" th:data-content="${item.hostnameExt}" th:text="${#strings.abbreviate(item.hostnameExt,25)}"></span></td>
              <td><span class="badge badge-success" th:text="${item.onlineTimeStr}">已完成</span></td>
              <td><span class="badge bg-primary" style="background:#fd517d!important" th:text="${item.downTimeStr}"></span></td>
              <td th:text="${#dates.format(item.lastTime,'yyyy-MM-dd HH:mm:ss')}">Update software</td>
              <td th:if="${application.hostGroup == 'true'}"><span  data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" th:data-content="${item.groupId}" th:text="${#strings.abbreviate(item.groupId,60)}"></span></td>
              <td th:text="${item.account}" th:if="${application.LICENSE_STATE eq '1' && application.userInfoManage == 'true' && session.LOGIN_KEY.role == 'admin'}"></td>
              <td th:text="${#dates.format(item.createTime,'yyyy-MM-dd HH:mm:ss')}">Update software</td>
              <td>
                <th:block th:if="${session.LOGIN_KEY.role != 'guest'}">
                  <button type="button"  th:onclick="del([[${item.id}]])"  class="btn bg-danger btn-sm">删除</button>
                  <button type="button"  th:onclick="setHostBindIp([[${item.id}]],[[${item.hostname}]])"  class="btn btn-primary btn-sm" data-toggle="modal" data-target="#modal-default">修改bindIp</button>
                </th:block>
                <button type="button"  th:onclick="view([[${item.hostname}]])"  class="btn btn-primary btn-sm">查看</button>
              </td>
            </tr>
          </th:block>

          </tbody>
        </table>
      </div>
      <!-- /.card-body -->
      <div th:replace="common/page.html"></div>
    </div>
    <!-- /.card -->


  </div><!-- /.col-md-12 -->

        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </section><!-- /.content -->
  </div><!-- /.content-wrapper -->

  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->

<div class="modal fade" id="modal-default">
  <div class="modal-dialog">
    <form method="post" id="form" th:action="@{'/agentRunState/saveAgentBindIp'}">
      <div class="modal-content" style="font-size:0.90rem">
        <div class="modal-header">
          <h4 class="modal-title">修改Agent主机配置参数bindIp</h4>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p>
            <input type="hidden" id="id" name="id"/>
            <label><font color="red">*</font>请输入新的bindIp，完成后请点击保存</label>
            <input type="text"  autocomplete="off" class="validate[required,maxSize[50] form-control" name="bindIp" id="bindIp" placeholder="输入bindIp完成后请点击保存">
          </p>
        </div>
        <div class="modal-footer justify-content-between">
          <button type="button" class="btn btn-default  btn-sm" data-dismiss="modal">关 闭</button>
          <button type="button" onclick="ajaxSaveBindIp()" class="btn btn-primary btn-sm">保 存</button>
        </div>
      </div>
    </form>
    <!-- /.modal-content -->
  </div>
  <!-- /.modal-dialog -->
</div>

<script th:src="@{'/static/js/agentRunState.js?v=3.6.2'}"></script>

<script th:inline="javascript">
  $(document).ready(function(){
    $("#groupId").val([[${agentRunState.groupId}]]);
    $("#account").val([[${agentRunState.account}]]);
    $('.select2').select2();
  });

  var msg = [[${msg}]];
  if(msg!='' && msg!=null){
    toastr.info(msg);
  }

  var msgModifyAgentConfig = [[${msgModifyAgentConfig}]];
  if(msgModifyAgentConfig!='' && msgModifyAgentConfig!=null){
    toastr.success(msgModifyAgentConfig);
  }

</script>

</body>
</html>
