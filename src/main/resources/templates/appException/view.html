<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>

</head>
<body th:class="${session.sidebarCollapse}">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>

  <!-- Content Wrapper. Contains page content -->
  <div th:class="'content-wrapper '+${session.themeNameSign}" style="font-size:0.90rem">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1></h1>
          </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item active"></li>
                </ol>
            </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

  <div class="col-md-11">
    <div th:class="'card card-primary '+${session.themeNameSign}">
      <div class="card-header">
        <h3 class="card-title">查看异常进程详细信息</h3>
          <div class=" float-sm-right">
              <a href="javascript:history.back()">返回上级</a>
          </div>
      </div>
      <!-- /.card-header -->
      <!-- form start -->
        <form role="form" id="form1" th:action="@{'/passwdInfo/save'}">
            <div class="card-body">
                <div class="form-group">
                    <label>主机IP</label>
                    <div  th:text="${appExceptionInfo.hostname}" ></div>
                </div>
                <div class="form-group">
                    <label>进程名称</label>
                    <div  th:text="${appExceptionInfo.appName}" ></div>
                </div>
                <div class="form-group">
                    <label>PID</label>
                    <div  th:text="${appExceptionInfo.gatherPid}" ></div>
                </div>
                <div class="form-group">
                    <label>内存使用 </label>
                    <div  th:text="${appExceptionInfo.memPer}+'MB'" ></div>
                </div>
                <div class="form-group">
                    <label>CPU%</label>
                    <div  th:text="${appExceptionInfo.cpuPer}" ></div>
                </div>
                <div class="form-group">
                    <label>启动时间</label>
                    <div  th:text="${appExceptionInfo.appTimes}" ></div>
                </div>
                <div class="form-group">
                    <label>从磁盘累计读取数据</label>
                    <div  th:text="${appExceptionInfo.readBytes}" ></div>
                </div>
                <div class="form-group">
                    <label>累计往磁盘写入数据</label>
                    <div  th:text="${appExceptionInfo.writesBytes}" ></div>
                </div>
                <div class="form-group">
                    <label>线程数</label>
                    <div  th:text="${appExceptionInfo.threadsNum}" ></div>
                </div>
                <div class="form-group">
                    <label>连接数</label>
                    <div  th:text="${appExceptionInfo.netConnections}" ></div>
                </div>
                <div class="form-group">
                    <label>进程所有者</label>
                    <div  th:text="${appExceptionInfo.proUsername}" ></div>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <div>
                        <th:block th:if="${appExceptionInfo.state  == '2'}">
                            <span >正在结束</span>
                        </th:block>
                        <th:block th:if="${appExceptionInfo.state  != '2'}">
                           <span>运行中</span>
                        </th:block>
                    </div>
                </div>
                <div class="form-group">
                    <label>添加时间</label>
                    <div  th:text="${#dates.format(appExceptionInfo.createTime,'yyyy-MM-dd HH:mm:ss')}" ></div>
                </div>
                <div  th:if="${application.LICENSE_STATE eq '1' && application.userInfoManage == 'true' && session.LOGIN_KEY.role == 'admin'}" class="form-group">
                    <label>成员账号</label>
                    <div  th:text="${appExceptionInfo.account}" ></div>
                </div>
                <div class="form-group">
                    <label>命令行</label>
                    <div><code class="highlighter-rouge" style="font-size:100%;font-weight:700" th:text="${appExceptionInfo.appCmdLine}"></code></div>
                </div>

            </div>
            <!-- /.card-body -->

        </form>
      <!-- /.card-body -->
    </div>
    <!-- /.card -->


  </div>

        </div>
      </div>
    </section>
  </div>


  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->

<script th:src="@{'/static/js/appExceptionInfo.js?v=3.5.5'}"></script>
<script th:inline="javascript">
    $(document).ready(function(){
        var clipboard = new ClipboardJS('.btncopy');
        clipboard.on('success', function (e) {
            toastr.success("复制成功");
        });
    });

</script>
</body>
</html>
