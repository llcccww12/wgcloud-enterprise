<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>

</head>
<body th:class="${session.sidebarCollapse}">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>

  <!-- Content Wrapper. Contains page content -->
  <div th:class="'content-wrapper '+${session.themeNameSign}"  style="font-size:0.90rem">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1></h1>
          </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item active"></li>
                </ol>
            </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

  <div class="col-md-11">
    <div th:class="'card card-primary '+${session.themeNameSign}">
      <div class="card-header">
        <h3 class="card-title">查看文件防篡改监控（每10分钟扫描一次，若文件被篡改或删除，会告警通知）</h3>
          <div class=" float-sm-right">
              <a href="javascript:history.back()">返回上级</a>
          </div>
      </div>
      <!-- /.card-header -->
      <!-- form start -->
        <form>
            <input type="hidden" name="id" th:value="${fileSafe.id}"/>
            <div class="card-body">
                <div class="form-group">
                    <label><font color="red">*</font>监控主机</label>
                    <div  th:text="${fileSafe.hostname}"></div>
                </div>
                <div class="form-group">
                    <label><font color="red">*</font>监控文件类型
                        <span  data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="个人版可以监控文件，如果需要监控文件夹，请升级到专业版即可"  style="cursor:pointer;margin-left: 10px"><i class="fa fa-comment-dots"></i></span>
                    </label>
                    <div class="input-group">
                        <div class="icheck-primary d-inline">
                            <input type="radio" id="radioFileIsDir1" name="fileIsDir" value="1">
                            <label for="radioFileIsDir1"><span style="opacity:.70">文件夹</span></label>
                        </div>
                        <div class="icheck-danger d-inline" style="margin-left:50px;">
                            <input type="radio" id="radioFileIsDir2" name="fileIsDir" value="2"  checked>
                            <label for="radioFileIsDir2"><span style="opacity:.70">文件</span></label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label><font color="red">*</font>文件名称 </label>
                    <div  th:text="${fileSafe.fileName}"></div>
                </div>
                <div class="form-group">
                    <label><font color="red">*</font>文件或文件夹完整路径</label>
                    <div  th:text="${fileSafe.filePath}"></div>
                </div>
                <div class="form-group">
                    <label>文件的MD5字符串<span class="text-muted">（大小写均可，Linux可以用命令[md5sum 文件名称]获取。如果是监控文件夹类型，此处不用输入）</span></label>
                    <div><span th:text="${fileSafe.fileSign}"></span><span th:if="${fileSafe.fileSign} == null or ${fileSafe.fileSign} == ''">无</span></div>
                </div>
                <div class="form-group">
                    <label>自动恢复指令<span data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="当检测到文件或者文件夹被篡改后触发，agent会自动执行下方输入的指令或脚本，如果不需要执行，删除指令或停止监控即可，此功能需升级到专业版" class="text-muted">（多条指令请换行输入）</span><span class="text-muted" th:text="${blockStr}">敏感字符串过滤</span></label>
                    <label><span style="color: #62d45e!important;">如果指令很多，比如超过10行或带有逻辑判断，建议将指令写入到一个脚本(存在被监控主机)，然后在这里执行脚本</span></label>
                    <textarea class="validate[maxSize[500]] form-control"   name="customShell" id="customShell" th:text="${fileSafe.customShell}"></textarea>
                </div>
                <div class="form-group">
                    <label><font color="red">*</font>告警级别</label>
                    <div th:replace="common/warnLevel.html"></div>
                </div>
                <div class="form-group clearfix">
                    <label><font color="red">*</font>监控状态</label>
                    <div th:replace="common/activeRadio.html"></div>
                </div>
                <div class="form-group"  th:if="${application.hostGroup == 'true'}">
                    <label>标签</label>
                    <div><span th:text="${fileSafe.groupId}"></span><span th:if="${fileSafe.groupId} == null or ${fileSafe.groupId} == ''">无</span></div>
                </div>
                <div class="form-group">
                    <label>更新时间</label>
                    <div  th:text="${#dates.format(fileSafe.createTime,'yyyy-MM-dd HH:mm:ss')}" ></div>
                </div>
                <div class="form-group">
                    <label>监控任务执行状态</label>
                    <div><code class="highlighter-rouge" style="font-size:100%;font-weight:700" th:text="${fileSafeErrorMsg}"></code></div>
                </div>
                <div class="form-group">
                    <label>自动恢复指令执行状态</label>
                    <div><code class="highlighter-rouge" style="font-size:100%;font-weight:700" th:text="${shellCallBackMsg}"></code></div>
                </div>

            </div>
            <!-- /.card-body -->

            <div class="card-footer">
                <button type="button"  th:onclick="goback()"  class="btn bg-danger btn-sm"><i class="fas fa-backward"></i> 返 回</button>
            </div>

        </form>
      <!-- /.card-body -->
    </div>
    <!-- /.card -->


  </div><!-- /.col-md-10 -->

        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </section><!-- /.content -->
  </div><!-- /.content-wrapper -->


  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->

<script th:src="@{'/static/js/fileSafe.js?v=3.5.0'}"></script>
<div th:replace="common/codemirror.html"></div>
<script th:inline="javascript">
    $(document).ready(function(){
        var warnLevel = [[${fileSafe.warnLevel}]];
        $("input[name='warnLevel'][value='"+warnLevel+"']").attr('checked','true');
        var active = [[${fileSafe.active}]];
        $("input[name='active'][value='"+active+"']").attr('checked','true');
        var fileIsDir = [[${fileSafe.fileIsDir}]];
        $("input[name='fileIsDir'][value='"+fileIsDir+"']").attr('checked','true');

        var editor = CodeMirror.fromTextArea(document.getElementById("customShell"), {
            lineNumbers: true,
            styleActiveLine: true,
            matchBrackets: true,
            mode: 'shell',
        });
        editor.setOption("theme", "dracula");
        editor.setSize('auto','220px');
    });

    var msg = [[${msg}]];
    if(msg!='' && msg!=null){
        toastr.error(msg);
    }
</script>
</body>
</html>
