<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>


</head>
<body th:class="${session.sidebarCollapse}">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>

  <!-- Content Wrapper. Contains page content -->
  <div th:class="'content-wrapper '+${session.themeNameSign}"  style="font-size:0.90rem">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1></h1>
          </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item active"></li>
                </ol>
            </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

  <div class="col-md-11">
    <div th:class="'card card-primary '+${session.themeNameSign}">
      <div class="card-header">
        <h3 class="card-title">添加设备PING监测（如路由器、交换机、防火墙等有IP的设备）</h3>
          <div class=" float-sm-right">
              <a href="javascript:history.back()">返回上级</a>
          </div>
      </div>
      <!-- /.card-header -->
      <!-- form start -->
        <form role="form" id="form1" method="post" th:action="@{'/dceInfo/save'}">
            <input type="hidden" name="id" th:value="${dceInfo.id}"/>
            <div class="card-body">
                <div class="form-group">
                    <label><font color="red">*</font>IP</label>
                    <input type="text" autocomplete="off"  th:value="${dceInfo.hostname}" class="validate[required,maxSize[50]] form-control" name="hostname" id="hostname" placeholder="输入IP，如：192.168.1.2">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <input type="text" autocomplete="off"  th:value="${dceInfo.remark}" class="validate[maxSize[50]] form-control" name="remark" id="remark" placeholder="如路由器">
                </div>
                <div class="form-group">
                    <label>排序序号<span class="text-muted">（可选，用于在列表页面排序，默认从大到小排序，数字可以重复）</span></label>
                    <input type="text" autocomplete="off"  th:value="${dceInfo.orderNum}" class="validate[custom[number],maxSize[10]] form-control" name="orderNum" id="orderNum" placeholder="用于在列表页面排序，数字越大，排序越靠前">
                </div>
                <div id="dataFormList" class="form-group clearfix"></div>
                <th:block th:if="${#strings.isEmpty(dceInfo.id)}" >
                    <div class="form-group row">
                        <div class="col-12"><button  type="button" onclick="addDataForm()" class="btn btn-primary btn-sm float-right"><i class="fa fa-plus-circle"></i> 添加一行</button>&nbsp;</div>
                    </div>
                    <input type="hidden" name="dataFromIndex"  id="dataFromIndex"/>
                </th:block>
                <div class="form-group">
                    <label><font color="red">*</font>告警级别</label>
                    <div th:replace="common/warnLevel.html"></div>
                </div>
                <div class="form-group clearfix">
                    <label><font color="red">*</font>监控状态</label>
                    <div th:replace="common/activeRadio.html"></div>
                </div>
            </div>
            <!-- /.card-body -->

            <div class="card-footer">
                <button type="submit" class="btn btn-primary btn-sm" style="margin-right:10px;"><i class="fas fa-save"></i> 保 存</button>
                <button type="button"  th:onclick="goback()"  class="btn bg-danger btn-sm"><i class="fas fa-backward"></i> 返 回</button>
            </div>

        </form>
      <!-- /.card-body -->
    </div>
    <!-- /.card -->


  </div><!-- /.col-md-10 -->

        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </section><!-- /.content -->
  </div><!-- /.content-wrapper -->


  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->

<!-- 动态添加一行数据 -->
<div  id="dataHideContent" style="display: none">
    <div id="dataFrom_{num}" class="card card-primary card-outline">
        <div class="card-body">
            <div class="form-group">
                <label><font color="red">*</font>IP</label>
                <input type="text" autocomplete="off"  class="validate[required,maxSize[50]] form-control" name="hostname_{num}" id="hostname_{num}" placeholder="输入IP，如：192.168.1.2">
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" autocomplete="off"  class="validate[maxSize[50]] form-control" name="remark_{num}" id="remark_{num}" placeholder="如路由器">
            </div>
            <div class="form-group">
                <label>排序序号</label>
                <input type="text" autocomplete="off"  class="validate[custom[number],maxSize[10]] form-control" name="orderNum_{num}" id="orderNum_{num}" placeholder="">
            </div>
            <div class="form-group">
                <div class="col-12"><button type="button" onclick="removeDiv('dataFrom_{num}')" class="btn bg-danger btn-sm float-right"><i class="far fa-trash-alt"></i> 删除</button></div>
            </div>
        </div>
    </div>
</div>


<script th:src="@{'/static/js/dce.js?v=3.5.0'}"></script>
<script th:inline="javascript">
    $(document).ready(function(){
        $("#form1").validationEngine();
        var warnLevel = [[${dceInfo.warnLevel}]];
        $("input[name='warnLevel'][value='"+warnLevel+"']").attr('checked','true');
        var active = [[${dceInfo.active}]];
        $("input[name='active'][value='"+active+"']").attr('checked','true');
        $("#hostname").on("change",function (e) {checkRepeat()});
    });
</script>
</body>
</html>
