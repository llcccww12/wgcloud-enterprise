<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>


</head>
<body th:class="${session.sidebarCollapse}">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>

  <!-- Content Wrapper. Contains page content -->
  <div th:class="'content-wrapper '+${session.themeNameSign}"  style="font-size:0.90rem">
    <!-- Content Header (Page header) -->
    <section class="content-header" style="height:38px">
      <div class="container-fluid">
        <div class="row mb-2" style="margin-top: -7px;">
          <div class="col-sm-6"></div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item" data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="正在监控中的资源"><a th:href="@{'/dceInfo/list?active=1'}">监控中</a></li>
              <li class="breadcrumb-item" data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="已停止监控的资源"><a th:href="@{'/dceInfo/list?active=2'}">已停止</a></li>
              <li class="breadcrumb-item"><a href="javascript:history.back()">返回上级</a></li>
              <li class="breadcrumb-item">
                <a data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="请选择需要隐藏的列，退出登录后失效" data-widget="control-sidebar" data-slide="true" href="#">
                  <i class="fas fa-th-large"></i>
                </a>
              </li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

  <div class="col-md-12">
    <div th:class="'card '+${session.themeNameSign}">
      <div class="card-header">
        <h3 class="card-title"><i class="nav-icon fas fa-route"></i>&nbsp;PING监测列表</h3>
        <div class=" float-sm-right">
          <!-- SEARCH FORM -->
          <form class="form-inline ml-3" th:action="@{'/dceInfo/list'}">
            <th:block th:if="${session.LOGIN_KEY.role != 'guest'}">
              <button type="button" title="一键导入所有监控主机到此处，发现已有的相同IP会自动跳过" th:onclick="importHosts()" class="btn btn-primary btn-sm" style="margin-right:5px;">导入监控主机</button>&nbsp;
            </th:block>
            <a th:href="@{'/tuopu/tuopuListSt'}" class="btn btn-sm bg-teal" style="margin-right:5px;"><i class="fas fa-network-wired"></i> 拓扑图</a>
            <button type="button" onclick="searchByOnline('')" class="btn btn-primary btn-sm" style="margin-right:5px;">全部</button>
            <button type="button" onclick="searchByOnline('200')" class="btn btn-success btn-sm" style="margin-right:5px;">在线</button>
            <button type="button" onclick="searchByOnline('500')" class="btn bg-danger btn-sm" style="margin-right:5px;">已离线</button>
            <th:block th:if="${session.LOGIN_KEY.role != 'guest'}">
              <button type="button" onclick="startMonitor('/dceInfo/updateActive')" class="btn btn-primary btn-sm" style="margin-right:5px;">开始监控</button>
              <button type="button" onclick="stopMonitor('/dceInfo/updateActive')" class="btn btn-default btn-sm" style="margin-right:5px;">停止监控</button>
              <button type="button" onclick="delChecks('/dceInfo/del')"  class="btn bg-danger btn-sm" style="margin-right:5px;">删除</button>
              <button type="button" th:if="${application.LICENSE_STATE eq '1' && application.userInfoManage == 'true' && session.LOGIN_KEY.role == 'admin'}" onclick="showMoveToAccount('5')"  class="btn btn-warning btn-sm" style="margin-right:5px;">迁移</button>
              <th:block th:if="${application.hostGroup == 'true'}"><button type="button" th:onclick="showSetGroupId()" class="btn btn-primary btn-sm" style="margin-right:5px;">设置标签</button></th:block>
              <button type="button" onclick="add()" class="btn btn-primary btn-sm" style="margin-right:5px;">添加</button>
              <button type="button" th:onclick="excelExportList()" class="btn btn-primary btn-sm" style="margin-right:5px;">导出Excel</button>
            </th:block>
            <div class="input-group input-group-sm" th:if="${application.hostGroup == 'true'}"><select style="width:150px;margin-right:5px;" th:class="'form-control '+${session.themeNameSign}" onchange="searchByGroupId()" name="groupId" id="groupId">
              <option value="">选择标签</option>
              <th:block th:each="item,iterStat : ${hostGroupList}">
                <option  th:value="${item.id}"  th:text="${item.groupName}">Alabama</option>
              </th:block>
            </select></div>
            <div th:replace="common/accountSelect.html"></div>
            <div class="input-group input-group-sm">
              <input th:class="'form-control '+${session.themeNameSign}"  id="hostname" name="hostname" autocomplete="off" th:value="${dceInfo.hostname}" type="text" placeholder="输入IP">
              <div class="input-group-append">
                <button class="btn btn-primary" type="submit">
                  <i class="fas fa-search"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <!-- /.card-header -->
      <div class="card-body">
        <table th:class="'table table-bordered '+${session.themeTableHoverSign}">
          <thead>
          <tr>
            <th style="width: 20px"> <input type="checkbox" value="" name="checkall" id="checkall"></th>
            <th style="width: 60px">序号</th>
            <th:block th:if="${dceInfo.orderBy  == 'HOST_NAME'}">
              <th:block th:if="${dceInfo.orderType  == 'ASC'}">
                <th style="cursor:pointer" onclick="searchByOrder('HOST_NAME','DESC')">IP<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-up" style="vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
              <th:block th:if="${dceInfo.orderType  == 'DESC'}">
                <th style="cursor:pointer" onclick="searchByOrder('HOST_NAME','ASC')">IP<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-down" style="color: #dc3545!important;vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
            </th:block>
            <th:block th:if="${dceInfo.orderBy  ne 'HOST_NAME'}">
              <th style="cursor:pointer" onclick="searchByOrder('HOST_NAME','ASC')">IP<small  class="text-muted mr-1 float-right"><i class="fa-solid fa-up-down" style="vertical-align:bottom;"></i></small></th>
            </th:block>


            <th:block th:if="${dceInfo.orderBy  == 'RES_TIMES'}">
              <th:block th:if="${dceInfo.orderType  == 'ASC'}">
                <th style="cursor:pointer" onclick="searchByOrder('RES_TIMES','DESC')">响应时间ms<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-up" style="vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
              <th:block th:if="${dceInfo.orderType  == 'DESC'}">
                <th style="cursor:pointer" onclick="searchByOrder('RES_TIMES','ASC')">响应时间ms<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-down" style="color: #dc3545!important;vertical-align:bottom;"></i>&nbsp;</small></th>
              </th:block>
            </th:block>
            <th:block th:if="${dceInfo.orderBy  ne 'RES_TIMES'}">
              <th style="cursor:pointer" onclick="searchByOrder('RES_TIMES','ASC')">响应时间ms<small  class="text-muted mr-1 float-right"><i class="fa-solid fa-up-down" style="vertical-align:bottom;"></i></small></th>
            </th:block>

            <th>备注</th>
            <th>监控状态</th>
            <th th:if="${application.showWarnCount == 'true'}" title="累积告警次数">告警次数</th>
            <th data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" data-content="若已离线，显示最后在线时间，但监控仍在继续">更新时间</th>
            <th th:if="${application.hostGroup == 'true'}">标签</th>
            <th>告警级别</th>
            <th th:if="${application.LICENSE_STATE eq '1' && application.userInfoManage == 'true' && session.LOGIN_KEY.role == 'admin'}">账号</th>
            <th:block  th:unless="${#strings.indexOf(session.PingListHideColsInfo ,'01') > -1 }">
              <th:block th:if="${dceInfo.orderBy  == 'ORDER_NUM'}">
                <th:block th:if="${dceInfo.orderType  == 'ASC'}">
                  <th style="cursor:pointer" onclick="searchByOrder('ORDER_NUM','DESC')">排序<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-up" style="vertical-align:bottom;"></i>&nbsp;</small></th>
                </th:block>
                <th:block th:if="${dceInfo.orderType  == 'DESC'}">
                  <th style="cursor:pointer" onclick="searchByOrder('ORDER_NUM','ASC')">排序<small    class="text-success mr-1 float-right"><i class="fas fa-arrow-down" style="color: #dc3545!important;vertical-align:bottom;"></i>&nbsp;</small></th>
                </th:block>
              </th:block>
              <th:block th:if="${dceInfo.orderBy  ne 'ORDER_NUM'}">
                <th style="cursor:pointer" onclick="searchByOrder('ORDER_NUM','ASC')">排序<small  class="text-muted mr-1 float-right"><i class="fa-solid fa-up-down" style="vertical-align:bottom;"></i></small></th>
              </th:block>
            </th:block>
            <th:block  th:unless="${#strings.indexOf(session.PingListHideColsInfo ,'02') > -1 }">
              <th>操作</th>
            </th:block>
          </tr>
          </thead>
          <tbody>
          <th:block th:each="item,iterStat : ${page.list}">
            <tr>
              <td><input type="checkbox" th:value="${item.id}" name="todo2" th:id="${item.id}+'_check'"/></td>
              <td th:text="${iterStat.index+1}">1</td>
              <th:block th:if="${item.resTimes  == -1}">
                <td><span  data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" th:data-content="${item.hostname}+' PING超时或失败，已离线'" class="badge bg-danger"    th:text="${#strings.abbreviate(item.hostname,25)}"></span>
              </th:block>
              <th:block th:if="${item.resTimes > -1}">
                <td><span   data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" th:data-content="${item.hostname}" th:text="${#strings.abbreviate(item.hostname,25)}"></span>
              </th:block>
              <td>
                <th:block th:if="${item.resTimes >= 500}">
                  <span class="badge bg-danger" th:text="${item.resTimes}"></span>
                </th:block>
                <th:block th:if="${item.resTimes < 500 && item.resTimes >= 100  }">
                  <span class="badge bg-warning" th:text="${item.resTimes}"></span>
                </th:block>
                <th:block th:if="${item.resTimes < 100  }">
                  <span class="badge bg-primary" th:text="${item.resTimes}"></span>
                </th:block>
              </td>
              <td th:text="${item.remark}">Update software</td>
              <td>
                <th:block th:if="${item.active  == '1'}">
                  <span class="badge bg-primary">监控中<span th:if="${item.serverBackupMark eq '1'}" title="此资源由server-backup监控"><i style="margin-left:2px;" class="fa-solid fa-fan"></i></span></span>
                </th:block>
                <th:block th:if="${item.active  == '2'}">
                  <span style="background:#6c757d!important;" class="badge bg-danger">已停止</span>
                </th:block>
              </td>
              <td th:if="${application.showWarnCount == 'true'}"><span style="cursor:pointer;color:#007bff;font-weight:bold" th:onclick="goHrefLogInfo([[${item.warnQueryWd}]])" th:text="${item.warnCount}"></span></td>
              <td th:text="${#dates.format(item.createTime,'yyyy-MM-dd HH:mm:ss')}">Update software</td>
              <td th:if="${application.hostGroup == 'true'}"><span  data-trigger="hover"  data-container="body" data-toggle="popover" data-placement="top" th:data-content="${item.groupId}" th:text="${#strings.abbreviate(item.groupId,60)}"></span></td>
              <td>
                <th:block th:if="${item.warnLevel  == 'ERROR'}">
                  <span class="badge bg-primary">重要</span>
                </th:block>
                <th:block th:if="${item.warnLevel  == 'WARN'}">
                  <span   style="color:#fff!important" class="badge bg-yellow">一般</span>
                </th:block>
                <th:block th:if="${item.warnLevel  == 'INFO'}">
                  <span  class="badge bg-teal">信息</span>
                </th:block>
              </td>
              <td th:text="${item.account}" th:if="${application.LICENSE_STATE eq '1' && application.userInfoManage == 'true' && session.LOGIN_KEY.role == 'admin'}"></td>
              <th:block  th:unless="${#strings.indexOf(session.PingListHideColsInfo ,'01') > -1 }"><td th:text="${item.orderNum}">Update software</td></th:block>
              <th:block  th:unless="${#strings.indexOf(session.PingListHideColsInfo ,'02') > -1 }">
                <td>
                  <th:block th:if="${session.LOGIN_KEY.role != 'guest'}">
                    <button type="button"  th:onclick="testHeath([[${item.id}]],[[${item.hostname}]])"  class="btn btn-primary btn-sm">测试</button>
                    <button type="button"  th:onclick="del([[${item.id}]])"  class="btn bg-danger btn-sm">删除</button>
                    <button type="button"  th:onclick="edit([[${item.id}]])"  class="btn btn-primary btn-sm">编辑</button>
                    <button type="button" data-toggle="modal" th:onclick="setHostOrderNum([[${item.id}]],[[${item.orderNum}]])"  class="btn btn-primary btn-sm" data-target="#modal-default5">设置排序</button>
                  </th:block>
                <button type="button"  th:onclick="view([[${item.id}]])"  class="btn btn-primary btn-sm">图表</button></td>
              </th:block>
            </tr>
          </th:block>

          </tbody>
        </table>
      </div>
      <!-- /.card-body -->
      <div th:replace="common/page.html"></div>
    </div>
    <!-- /.card -->


  </div><!-- /.col-md-12 -->

        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </section><!-- /.content -->
  </div><!-- /.content-wrapper -->


  <div class="modal fade" id="modal-default3">
    <div class="modal-dialog">
      <form method="post" id="form4" th:action="@{'/dceInfo/saveGroupId'}">
        <div class="modal-content" style="font-size:0.90rem">
          <div class="modal-header">
            <h4 class="modal-title">设置标签<span class="text-muted">（可多选，在系统管理中维护标签）</span></h4>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <p>
              <input type="hidden" id="id3" name="ids"/>
              <select class="select2" multiple="multiple" data-placeholder="请选择" style="width: 100%;" name="groupId">
                <option  value="">请选择</option>
                <th:block th:each="item,iterStat : ${hostGroupList}">
                  <option  th:value="${item.id}"  th:text="${item.groupName}">Alabama</option>
                </th:block>
              </select>
            </p>
          </div>
          <div class="modal-footer justify-content-between">
            <button type="button" class="btn btn-default  btn-sm" data-dismiss="modal">关 闭</button>
            <button type="button" onclick="ajaxSaveGroupId()" class="btn btn-primary btn-sm">保 存</button>
          </div>
        </div>
      </form>
      <!-- /.modal-content -->
    </div>
    <!-- /.modal-dialog -->
  </div>

  <div class="modal fade" id="modal-default5">
    <div class="modal-dialog">
      <form method="post" id="form5" th:action="@{'/dceInfo/updateOrderNum'}">
        <div class="modal-content" style="font-size:0.90rem">
          <div class="modal-header">
            <h4 class="modal-title">编辑排序序号</h4>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <p>
              <input type="hidden" id="id5" name="id"/>
              <input type="text"  autocomplete="off" class="validate[custom[number],maxSize[10] form-control" name="orderNum" id="hostOrderNum" placeholder="输入数字，默认从大到小进行排序，数字可以重复，也可以是负数">
            </p>
          </div>
          <div class="modal-footer justify-content-between">
            <button type="button" class="btn btn-default  btn-sm" data-dismiss="modal">关 闭</button>
            <button type="button" onclick="ajaxSaveOrderNum()" class="btn btn-primary btn-sm">保 存</button>
          </div>
        </div>
      </form>
      <!-- /.modal-content -->
    </div>
    <!-- /.modal-dialog -->
  </div>

  <!-- Control Sidebar -->
  <aside class="control-sidebar control-sidebar-dark">
    <!-- Control sidebar content goes here -->
    <form method="post" id="form6" th:action="@{'/dceInfo/savePingListHideCols'}">
      <div class="p-3 control-sidebar-content">
        <button type="button" class="close" data-widget="control-sidebar" data-slide="true"  style="color:#FFF" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
        <h5>请选择需要隐藏的列</h5>
        <hr class="mb-2">
        <div class="mb-1"><input type="checkbox" name="pingListHideCols" value="01" class="mr-1"><span>排序序号</span></div>
        <div class="mb-1"><input type="checkbox" name="pingListHideCols" value="02" class="mr-1"><span>操作</span></div>
        <h6></h6>
        <div class="d-flex flex-wrap mb-3">
          <button type="button" onclick="ajaxSavePingListHideCols()" style="margin-right:5px;" class="btn btn-primary btn-sm">保存</button>
          <button type="button" onclick="resetPingListHideCols()"  class="btn bg-danger btn-sm">清空</button></div></div>
    </form>
  </aside>

  <!-- /.control-sidebar -->
  <div th:replace="common/moveAccount.html"></div>
  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->

<script th:src="@{'/static/js/dce.js?v=3.5.6'}"></script>
<script th:inline="javascript">
  $(document).ready(function(){
    $("#groupId").val([[${dceInfo.groupId}]]);
    $("#account").val([[${dceInfo.account}]]);
    $('.select2').select2();
  });

  var pingListHideColsInfo = [[${session.PingListHideColsInfo}]];
  // 回显选中的隐藏列
  if("" != pingListHideColsInfo){
    $("input[name='pingListHideCols'][type='checkbox']").each(function () {
      var hostListHideColsVal = $(this).val();
      if(pingListHideColsInfo.indexOf(hostListHideColsVal)>-1){
        $(this).attr('checked','checked');
      }
    })
  }

  function ajaxSavePingListHideCols(){
    $("#form6").ajaxSubmit(function(message) {
      window.location.href = window.location.href;
    });
  }

  function resetPingListHideCols(){
    $("input[name='pingListHideCols'][type='checkbox']").each(function () {
      $(this).prop("checked",false);
      $(this).removeAttr('checked');
    })
  }

  var msg = [[${msg}]];
  if(msg!='' && msg!=null){
    toastr.info(msg);
  }
</script>

</body>
</html>
